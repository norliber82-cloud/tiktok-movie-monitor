name: Monitor

on:
  schedule:
    - cron: "*/45 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright WebKit
        run: python -m playwright install --with-deps webkit

      - name: Run monitor
        env:
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET:  ${{ secrets.FEISHU_SECRET }}

          FEISHU_APP_ID:          ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:      ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN:      ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_VIDEOS_TABLE:   ${{ secrets.BITABLE_VIDEOS_TABLE }}
          BITABLE_CREATORS_TABLE: ${{ secrets.BITABLE_CREATORS_TABLE }}

          PYTHONUNBUFFERED: "1"
        run: python -m src.main

      - name: Commit updated DB
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f videos.db ]]; then
            git add videos.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: update videos.db [skip ci]"
              git push
            else
              echo "No DB changes."
            fi
          else
            echo "videos.db not found."
          fi
