name: Monitor (fast)

on:
  schedule:
    # Every 45 minutes.
    - cron: "*/45 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor-fast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-1.49.0

      - name: Install Playwright WebKit
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps webkit
          else
            python -m playwright install --with-deps webkit
          fi

      - name: Run monitor (fast)
        env:
          MS_TOKEN:               ${{ secrets.MS_TOKEN }}
          FEISHU_WEBHOOK:         ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET:          ${{ secrets.FEISHU_SECRET }}
          FEISHU_APP_ID:          ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:      ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN:      ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_VIDEOS_TABLE:   ${{ secrets.BITABLE_VIDEOS_TABLE }}
          BITABLE_CREATORS_TABLE: ${{ secrets.BITABLE_CREATORS_TABLE }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.main --mode fast

      - name: Commit updated DB
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -- videos.db || true
          git pull --rebase origin main || true
          git stash pop || true
          if [[ -f videos.db ]]; then
            git add videos.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: update videos.db [skip ci]"
              git push || true
            else
              echo "No DB changes."
            fi
          fi
