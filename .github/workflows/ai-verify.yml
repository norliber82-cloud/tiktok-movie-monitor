name: AI Verify (voiceover commentary)

on:
  schedule:
    - cron: "0 4,16 * * *"   # twice a day at 04:00 and 16:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ai-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Run AI voiceover verification
        env:
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          FEISHU_APP_ID:            ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:        ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN:        ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_VIDEOS_TABLE:     ${{ secrets.BITABLE_VIDEOS_TABLE }}
          BITABLE_JP_VIDEOS_TABLE:  ${{ secrets.BITABLE_JP_VIDEOS_TABLE }}
          PYTHONUNBUFFERED:         "1"
        run: python -m src.ai_voiceover_check
