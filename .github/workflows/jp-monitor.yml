name: Monitor JP

on:
  schedule:
    - cron: "10 * * * *"   # every hour at :10
  workflow_dispatch: {}

concurrency:
  group: monitor-jp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-1.49.0

      - name: Install Playwright WebKit
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps webkit
          else
            python -m playwright install --with-deps webkit
          fi

      # JP DB cache is fully isolated from US.
      - name: Restore JP DB cache
        uses: actions/cache/restore@v4
        with:
          path: videos.db
          key: tiktok-db-jp-${{ github.run_id }}
          restore-keys: tiktok-db-jp-

      - name: Run JP monitor
        env:
          MS_TOKEN:                  ${{ secrets.MS_TOKEN_JP }}
          MS_TOKEN_JP:               ${{ secrets.MS_TOKEN_JP }}
          FEISHU_WEBHOOK:            ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET:             ${{ secrets.FEISHU_SECRET }}
          FEISHU_APP_ID:             ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:         ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN:         ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_VIDEOS_TABLE:      ${{ secrets.BITABLE_JP_VIDEOS_TABLE }}
          BITABLE_CREATORS_TABLE:    ${{ secrets.BITABLE_JP_CREATORS_TABLE }}
          BITABLE_JP_VIDEOS_TABLE:   ${{ secrets.BITABLE_JP_VIDEOS_TABLE }}
          BITABLE_JP_CREATORS_TABLE: ${{ secrets.BITABLE_JP_CREATORS_TABLE }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.jp_runner

      - name: Save JP DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: videos.db
          key: tiktok-db-jp-${{ github.run_id }}
