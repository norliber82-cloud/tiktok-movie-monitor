name: Account Tracker (following + liked)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}

concurrency:
  group: account-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pysocks

      - name: Restore account state
        uses: actions/cache/restore@v4
        with:
          path: |
            .account_state/
          key: account-state-${{ github.run_id }}
          restore-keys: |
            account-state-

      - name: Write cookie files
        env:
          US_COOKIE_JSON: ${{ secrets.US_COOKIE_JSON }}
          JP_COOKIE_JSON: ${{ secrets.JP_COOKIE_JSON }}
        run: |
          mkdir -p .cookies
          echo "$US_COOKIE_JSON" > .cookies/us.json
          echo "$JP_COOKIE_JSON" > .cookies/jp.json

      - name: Run account tracker
        env:
          FEISHU_APP_ID:          ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:      ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN:      ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_VIDEOS_TABLE:   ${{ secrets.BITABLE_VIDEOS_TABLE }}
          BITABLE_CREATORS_TABLE: ${{ secrets.BITABLE_CREATORS_TABLE }}
          # Override paths for CI environment
          ACCOUNT_COOKIES_US:     .cookies/us.json
          ACCOUNT_COOKIES_JP:     .cookies/jp.json
          ACCOUNT_STATE_DIR:      .account_state
          # Disable proxy (GitHub runners have clean IPs)
          ALL_PROXY:              ""
          PYTHONUNBUFFERED:       "1"
        run: python -m src.account_tracker_ci

      - name: Save account state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .account_state/
          key: account-state-${{ github.run_id }}
